<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" fill="none">
  <defs>
    <linearGradient id="peak" x1="360" y1="35" x2="445" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202720"/>
      <stop offset="1" stop-color="#080B08"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="335" y1="65" x2="405" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151B15"/>
      <stop offset="1" stop-color="#060806"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="405" y1="65" x2="485" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D120E"/>
      <stop offset="1" stop-color="#030503"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(406 68) rotate(90) scale(115)">
      <stop stop-color="#9CFF3D" stop-opacity=".24"/>
      <stop offset=".45" stop-color="#9CFF3D" stop-opacity=".07"/>
      <stop offset="1" stop-color="#9CFF3D" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- subtle atmospheric glow behind the summit -->
  <ellipse cx="408" cy="92" rx="112" ry="100" fill="url(#greenGlow)"/>

  <!-- distant ridge -->
  <path d="M160 214 L215 182 L250 196 L286 163 L315 184 L350 151 L385 179 L420 147 L455 179 L520 158 L520 240 L160 240Z"
        fill="#0A0D0A"/>

  <!-- main mountain silhouette -->
  <path d="M250 240
           L282 205
           L316 178
           L343 142
           L368 108
           L399 65
           L412 43
           L425 82
           L446 119
           L470 151
           L492 175
           L520 196
           L520 240Z"
        fill="#070907"/>

  <!-- illuminated left face -->
  <path d="M282 205
           L316 178
           L343 142
           L368 108
           L399 65
           L412 43
           L404 93
           L390 127
           L374 158
           L354 190
           L330 220
           L305 240
           L250 240Z"
        fill="url(#leftFace)"/>

  <!-- darker right face -->
  <path d="M412 43
           L425 82
           L446 119
           L470 151
           L492 175
           L520 196
           L520 240
           L395 240
           L374 158
           L390 127
           L404 93Z"
        fill="url(#rightFace)"/>

  <!-- subtle summit ridge -->
  <path d="M399 65 L412 43 L425 82 L412 73 Z"
        fill="#2B332B" opacity=".8"/>

  <!-- foreground base -->
  <path d="M0 240
           L0 232
           L72 219
           L135 225
           L205 208
           L270 222
           L332 205
           L390 218
           L455 205
           L520 214
           L520 240Z"
        fill="#050705"/>

  <!-- flag pole -->
  <path d="M412 44 L412 13"
        stroke="#9CFF3D" stroke-width="2.8" stroke-linecap="round"/>

  <!-- flag -->
  <path d="M413 14
           C429 14 441 10 452 14
           L444 21
           L452 28
           C440 24 428 26 413 28Z"
        fill="#9CFF3D"/>

  <!-- tiny summit light -->
  <circle cx="412" cy="44" r="3.5" fill="#9CFF3D" opacity=".95"/>
  <circle cx="412" cy="44" r="10" fill="#9CFF3D" opacity=".13" filter="url(#softGlow)"/>
</svg>